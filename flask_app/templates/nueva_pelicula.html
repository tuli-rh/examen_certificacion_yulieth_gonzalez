<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva Película</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Nueva Película</h2>
        <div>
            <a href="/cine">Inicio</a> | <a href="/logout">Cerrar Sesión</a>
        </div>
    </div>
    {% with messages = get_flashed_messages(category_filter=["pelicula"]) %}
        {% if messages %}
            {% for msg in messages %}
                <div class="alert alert-danger py-1">{{ msg }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form action="/cine/crear" method="POST" class="col-md-6">
        <div class="mb-3">
            <label>Nombre de Peli:</label>
            <input type="text" name="titulo" class="form-control" value="{{ session.get('form_data', {}).get('titulo', '') }}">
        </div>
        <div class="mb-3">
            <label>Director:</label>
            <input type="text" name="director" class="form-control" value="{{ session.get('form_data', {}).get('director', '') }}">
        </div>
        <div class="mb-3">
            <label>Fecha Estreno:</label>
            <input type="date" name="fecha_estreno" class="form-control" value="{{ session.get('form_data', {}).get('fecha_estreno', '') }}">
        </div>
        <div class="mb-3">
            <label>Sinopsis:</label>
            <textarea name="sinopsis" class="form-control" rows="4">{{ session.get('form_data', {}).get('sinopsis', '') }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Guardar Película</button>
    </form>
</div>
</body>
</html>
