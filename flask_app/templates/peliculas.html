<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CinePedia - Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Bienvenido, {{ session['nombre'] }}</h1>
        <div>
            <a href="/cine/nueva" class="btn btn-primary">Nueva Peli</a>
            <a href="/logout" class="btn btn-danger">Cerrar Sesión</a>
        </div>
    </div>
    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>Película</th>
                <th>Director</th>
                <th>Fecha de Estreno</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% for peli in peliculas %}
            <tr>
                <td>{{ peli.titulo }}</td>
                <td>{{ peli.director }}</td>
                <td>{{ peli.fecha_estreno }}</td>
                <td>
                    <a href="/cine/{{ peli.id }}">Ver</a>
                    {% if peli.usuario_id == session['usuario_id'] %}
                        | <a href="/cine/editar/{{ peli.id }}">Editar</a>
                        | <a href="/cine/borrar/{{ peli.id }}">Borrar</a>
                    {% endif %}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
